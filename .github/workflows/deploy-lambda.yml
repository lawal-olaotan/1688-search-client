name: deploy-lambda.yml

on:
  push:
    branches: ['main']

env:
  ECR_REPOSITORY: '1688-image-search'
  FUNCTION_NAME: '1688-image-search-function'
  ALIAS_NAME: 'live'
  PROVISIONED_CONCURRENCY: '1'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install and compile dependencies
        run: |
          npm ci --ignore-scripts
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Update function code
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "${{ steps.build.outputs.image }}"
          aws lambda wait function-updated-v2 \
            --function-name "$FUNCTION_NAME"

      - name: Publish version
        id: publish
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name "$FUNCTION_NAME" \
            --query 'Version' \
            --output text)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upsert alias
        run: |
          if aws lambda get-alias --function-name "$FUNCTION_NAME" --name "$ALIAS_NAME" >/dev/null 2>&1; then
            aws lambda update-alias \
              --function-name "$FUNCTION_NAME" \
              --name "$ALIAS_NAME" \
              --function-version "${{ steps.publish.outputs.version }}" \
              --routing-config '{"AdditionalVersionWeights":{}}'
          else
            aws lambda create-alias \
              --function-name "$FUNCTION_NAME" \
              --name "$ALIAS_NAME" \
              --function-version "${{ steps.publish.outputs.version }}"
          fi

      - name: Reset provisioned concurrency on live alias
        run: |
          aws lambda delete-provisioned-concurrency-config \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$ALIAS_NAME" >/dev/null 2>&1 || true

          for i in {1..30}; do
            STATUS=$(aws lambda get-provisioned-concurrency-config \
              --function-name "$FUNCTION_NAME" \
              --qualifier "$ALIAS_NAME" \
              --query 'Status' \
              --output text 2>/dev/null || echo "DELETED")

            echo "Existing provisioned concurrency status: $STATUS"

            if [ "$STATUS" = "DELETED" ]; then
              break
            fi

            sleep 10
          done

      - name: Configure provisioned concurrency
        run: |
          aws lambda put-provisioned-concurrency-config \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$ALIAS_NAME" \
            --provisioned-concurrent-executions "$PROVISIONED_CONCURRENCY"

      - name: Wait for provisioned concurrency readiness
        run: |
          for i in {1..36}; do
            STATUS=$(aws lambda get-provisioned-concurrency-config \
              --function-name "$FUNCTION_NAME" \
              --qualifier "$ALIAS_NAME" \
              --query 'Status' \
              --output text)

            echo "Provisioned concurrency status: $STATUS"

            if [ "$STATUS" = "READY" ]; then
              exit 0
            fi

            if [ "$STATUS" = "FAILED" ]; then
              aws lambda get-provisioned-concurrency-config \
                --function-name "$FUNCTION_NAME" \
                --qualifier "$ALIAS_NAME"
              exit 1
            fi

            sleep 10
          done

          echo "Provisioned concurrency did not become READY in time"
          exit 1

      - name: Delete old Lambda versions
        env:
          KEEP_VERSION: ${{ steps.publish.outputs.version }}
        run: |
          aws lambda list-versions-by-function \
            --function-name "$FUNCTION_NAME" \
            --query "Versions[?Version!=\`$LATEST\` && Version!=\`$KEEP_VERSION\`].Version" \
            --output text | tr '\t' '\n' | while read -r VERSION; do
              [ -z "$VERSION" ] && continue
              echo "Deleting version $VERSION"
              aws lambda delete-function \
                --function-name "$FUNCTION_NAME" \
                --qualifier "$VERSION"
            done

      - name: Ensure Function URL exists for live alias
        run: |
          CORS_CONFIG='{
            "AllowOrigins":[
              "http://localhost:3000",
              "https://dev.robotdorm.com",
              "https://robotdorm.com"
            ],
            "AllowHeaders":["content-type","accept"],
            "AllowMethods":["POST"],
            "MaxAge":600,
            "AllowCredentials":false
          }'

          aws lambda update-function-url-config \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$ALIAS_NAME" \
            --cors "$CORS_CONFIG" >/dev/null 2>&1 && exit 0

          aws lambda create-function-url-config \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$ALIAS_NAME" \
            --auth-type NONE \
            --cors "$CORS_CONFIG" >/dev/null 2>&1 && exit 0

          aws lambda update-function-url-config \
            --function-name "$FUNCTION_NAME" \
            --qualifier "$ALIAS_NAME" \
            --cors "$CORS_CONFIG"
